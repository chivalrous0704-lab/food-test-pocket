<script>

// ----- app navigation history (v2.0.3) -----
let appNavCurrent=null;
let appNavStack=[];
let appNavGoingBack=false;
const appRootViews=new Set(['showList','showFoods','showProcesses','showCases']);

function appUpdateBackButton(){
 const b=document.getElementById('appBackFixed');
 if(!b) return;
 const show=!!appNavCurrent && !appRootViews.has(appNavCurrent.name) && appNavStack.length>0;
 b.classList.toggle('show',show);
}
function appBack(){
 if(!appNavStack.length) return;
 const target=appNavStack.pop();
 appNavGoingBack=true;
 try{
   window[target.name](...(target.args||[]));
 }finally{
   appNavGoingBack=false;
   appUpdateBackButton();
 }
}
function appInstallNavHistory(){
 const names=['showList','showFoods','showFood','foodResultGuide','showDetail','showProcesses','showProcess','showCases','showCase','showQuote'];
 names.forEach(name=>{
   const original=window[name];
   if(typeof original!=='function') return;
   window[name]=function(...args){
     if(!appNavGoingBack){
       if(appRootViews.has(name)){
         appNavStack=[];
       }else if(appNavCurrent){
         appNavStack.push({name:appNavCurrent.name,args:[...(appNavCurrent.args||[])]});
       }
     }
     appNavCurrent={name,args:[...args]};
     const result=original.apply(this,args);
     appUpdateBackButton();
     return result;
   };
 });
}

function money(x){return x==null?'要確認':x.toLocaleString()+'円'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function matches(t,s){s=s.trim().toLowerCase(); if(!s)return true; return (t.name+' '+t.cat+' '+t.foods+' '+t.feature+' '+t.when+' '+t.check+' '+t.tags).toLowerCase().includes(s)}

 app.innerHTML='<div class="hint">'+arr.length+'件表示　※料金・納期は社内資料の確定値を優先</div>'+ (arr.length?arr.map((t,i)=>`

 </div>`).join(''):'<div class="empty">該当する検査がありません</div>');
}

 <div class="note">「自主検査候補」は一般的な危害要因からの候補で、法的必須項目を意味しません。正式提案前に食品の法的区分、工程、原材料、喫食方法、顧客仕様を確認してください。</div>`;
}
function renderFoods(arr,groups){
 return groups.map(g=>{const xs=arr.filter(f=>f.group===g);if(!xs.length)return '';return `<h3 style="margin:18px 3px 6px">${esc(g)}</h3><div class="foodGrid">${xs.map(f=>{let i=foods.indexOf(f);return `<button type="button" class="foodTap" onclick="showFood(${i})"><span class="foodTapTitle">${f.icon} ${esc(f.name)}</span><span class="foodTapSub">${esc(f.summary)}</span></button>`}).join('')}</div>`}).join('');
}
function filterFoods(s){
 s=s.trim().toLowerCase(); const arr=!s?foods:foods.filter(f=>(f.name+' '+f.group+' '+f.summary+' '+f.reason).toLowerCase().includes(s));
 const groups=[...new Set(foods.map(f=>f.group))];
 document.getElementById('foodArea').innerHTML=arr.length?renderFoods(arr,groups):'<div class="empty">該当する食品がありません</div>';
}

function findTest(name){
 return tests.findIndex(t=>t.name===name || t.name.startsWith(name));
}
function addNamed(name){
 const i=findTest(name); if(i>=0 && !quote.includes(i)) quote.push(i);
 updateCount();
}
function addFoodSuggestions(i){
 foods[i].suggest.forEach(addNamed); showQuote();
}
function foodTestPriority(f,n){
 const name=f.name;
 if(name==='鶏肉・鶏肉加工品'){
  if(n.includes('カンピロバクター')) return {label:'△ 条件で優先',cls:'priorityCond',note:'鶏肉では重要な危害要因。特に内臓摘出・レバー/砂肝処理・解体・腸管内容物との接触・生肉の交差汚染がある施設では優先度が上がります。'};
  if(n.includes('サルモネラ')) return {label:'◎ 優先度高い',cls:'priorityHigh',note:'生の鶏肉・鶏由来原料を扱う場合は重要な危害要因として確認。'};
  return {label:'○ 衛生確認',cls:'priorityBase',note:'製品・工程の衛生状態を確認する候補。'};
 }
 if(/RTE|サンドイッチ|ローストビーフ|スモークサーモン|加熱済み野菜/.test(name) && n.includes('リステリア'))
  return {label:'△ 条件で優先',cls:'priorityCond',note:'加熱後に再加熱せず喫食し、冷蔵で保存期間がある場合は優先度が上がります。'};
 if(/おにぎり|ポテトサラダ|和菓子|生菓子|卵焼き|唐揚げ/.test(name) && n.includes('黄色ブドウ球菌'))
  return {label:'△ 手作業で優先',cls:'priorityCond',note:'加熱後の手作業・成形・盛付けが多いほど優先度が上がります。'};
 if(/カレー|シチュー|煮物/.test(name) && (n.includes('ウェルシュ')||n.includes('セレウス')))
  return {label:'△ 冷却条件で優先',cls:'priorityCond',note:'大量調理後にゆっくり冷却する、保温が長い、再加熱を繰り返す場合に優先度が上がります。'};
 if(/米飯|麺類/.test(name) && n.includes('セレウス'))
  return {label:'△ 冷却条件で優先',cls:'priorityCond',note:'加熱後の放冷・室温滞留・冷却に時間がかかる場合は優先度が上がります。'};
 if(/クッキー|焼菓子|パン|乾燥|ジャム|フルーツソース/.test(name) && (n.includes('真菌')||n.includes('酵母')))
  return {label:'△ 保存性で優先',cls:'priorityCond',note:'長い賞味期限、包装内の結露・吸湿、AwやpH条件によって優先度が上がります。'};
 if(/卵|液卵|卵焼き/.test(name) && n.includes('サルモネラ'))
  return {label:'△ 原料条件で優先',cls:'priorityCond',note:'未殺菌液卵、生・半熟使用、加熱条件の確認が必要な場合は優先度が上がります。'};
 if(/真空包装|低酸素/.test(name) && n.includes('クロストリジア'))
  return {label:'△ 製品条件で優先',cls:'priorityCond',note:'低酸素包装で、pH・Aw・加熱・冷蔵条件による増殖抑制を十分に説明できない場合は優先度が上がります。'};
 if(/刺身|生食用|寿司|かき|魚卵/.test(name) && n.includes('腸炎ビブリオ'))
  return {label:'△ 海産生食で優先',cls:'priorityCond',note:'海産魚介を生・非加熱で扱い、加工・洗浄・低温管理を確認したい場合に優先度が上がります。'};
 return {label:'○ 基本候補',cls:'priorityBase',note:'食品・工程・顧客仕様に応じて採否を判断する候補です。'};
}
function conditionalAdvice(f){
 const n=f.name, a=[];
 if(n==='鶏肉・鶏肉加工品'){
  a.push({test:'カンピロバクター（定性）',title:'内臓処理・解体をしている',text:'内臓摘出、レバー・砂肝処理、腸管内容物との接触がある場合は、処理工程で肉や他の内臓へ汚染が広がる可能性があるため、カンピロバクター確認の優先度を上げます。内臓処理がなくても鶏肉では重要な危害要因ですが、こうした工程があると工程検証としての意味がさらに大きくなります。'});
  a.push({test:'カンピロバクター（定性）',title:'生肉と加熱後製品の動線が交差する',text:'生肉用の手指・器具・作業台・冷蔵庫などからRTEや加熱後製品への交差汚染を確認したい場合は、製品検査に加えて器具・設備の拭き取りも検討します。'});
  a.push({test:'サルモネラ',title:'生の鶏原料を工場内で扱う',text:'原料由来の危害を想定し、加熱前原料・加熱工程・加熱後区域の分離まで含めて確認します。'});
 }
 if(/牛肉|生ハンバーグ|ひき肉/.test(n)) a.push({test:'O157',title:'ひき肉・成形・生食に近い工程がある',text:'表面の汚染が内部へ入りやすい工程や、生食・加熱不十分の可能性がある製品では、腸管出血性大腸菌の危害分析を優先します。'});
 if(/豚肉/.test(n)) a.push({test:'サルモネラ',title:'生原料を加工し加熱前後が近接する',text:'原料由来の病原菌と加熱後への交差汚染を切り分ける目的で優先度が上がります。'});
 if(/RTE|サンドイッチ|ローストビーフ|スモークサーモン|加熱済み野菜|いくら/.test(n)) a.push({test:'リステリア',title:'加熱後に再加熱せず、冷蔵で日持ちさせる',text:'加熱後のスライス・充填・包装や製造環境からの汚染と、冷蔵中の増殖を考慮して優先度を上げます。環境拭き取りも有効です。'});
 if(/弁当|サラダ|おにぎり|サンドイッチ|ポテトサラダ|和菓子|生菓子|卵焼き|唐揚げ|寿司/.test(n)) a.push({test:'黄色ブドウ球菌',title:'加熱後に手作業が多い',text:'成形・盛付け・トッピング・むき身など、人の手が入る工程が多いほど手指由来汚染の確認価値が上がります。放冷時間も合わせて確認します。'});
 if(/カレー|シチュー|煮物/.test(n)) a.push({test:'ウェルシュ（定性）',title:'大鍋調理・緩慢冷却・長時間保温がある',text:'芽胞が加熱後に生き残り、ゆっくり冷える間に増殖する可能性を考えるため、冷却条件の検証と合わせて優先します。'});
 if(/おにぎり|米飯|麺類/.test(n)) a.push({test:'セレウス（定性）',title:'炊飯・ゆで後に常温滞留や緩慢冷却がある',text:'芽胞形成菌なので、加熱の有無だけでなく、加熱後にどれだけ早く冷やし、何℃帯にどれだけ滞留したかを重視します。'});
 if(/クッキー|焼菓子|パン|乾燥|ジャム|フルーツソース|味噌|発酵調味料|カットフルーツ/.test(n)) a.push({test:'真菌（カビ）・酵母',title:'長期保存・結露・吸湿・包装トラブルがある',text:'一般生菌数が低くてもカビ・酵母が保存性を左右することがあります。Aw、pH、包装材、結露、保管湿度とセットで考えます。'});
 if(/真空包装|低酸素包装/.test(n)) a.push({test:'クロストリジア',title:'低酸素包装で長期保存する',text:'嫌気条件になるため、pH・Aw・加熱条件・冷蔵条件の組合せで増殖抑制が成立しているかを確認し、必要に応じて嫌気性芽胞菌を検討します。'});
 if(/卵|液卵/.test(n)) a.push({test:'サルモネラ',title:'未殺菌液卵・生または半熟用途がある',text:'原料由来リスクが高くなるため、原料仕様・殺菌の有無・加熱条件・低温管理と合わせて優先します。'});
 if(/刺身|生食用冷凍鮮魚介類|寿司|ゆでだこ|ゆでがに|かき/.test(n)) a.push({test:'腸炎ビブリオ',title:'海産魚介を生・非加熱で扱う',text:'原料、洗浄水、低温管理、加工器具からの二次汚染を確認したい場合に優先します。加熱済み品では加熱後工程も確認します。'});
 if(/豆腐|油揚げ|厚揚げ|豆乳/.test(n)) a.push({test:'大腸菌群',title:'加熱後に水さらし・冷却・充填・包装工程がある',text:'加熱後工程での水・器具・充填設備からの再汚染を確認したい場合に有効です。'});
 if(/井戸水|飲用水|ミネラルウォーター|氷/.test(n)) a.push({test:'大腸菌（E. coli）',title:'井戸水・地下水・製造用水を使用する',text:'水由来の衛生リスクを確認します。微生物だけでなく、用途に応じた水質検査項目全体も確認してください。'});
 if(/保存試験/.test(n)) a.push({test:'製品特性に合わせて選択',title:'賞味期限を延ばしたい・保存条件を変える',text:'一般生菌だけでなく、食品ごとにカビ・酵母・乳酸菌・芽胞菌、pH、Aw、官能を組み合わせて設計します。'});
 if(!a.length){
  if(f.group==='冷凍食品') a.push({test:'製品区分に応じて選択',title:'凍結直前の加熱有無・喫食前加熱の有無が違う',text:'同じ冷凍食品でも区分により見るべき指標や危害が変わります。製造時の加熱と喫食方法を先に確認します。'});
  else if(f.group==='漬物') a.push({test:'大腸菌群・酵母など',title:'非加熱・浅漬け・低塩・短時間漬け',text:'原料野菜由来の汚染と、pH・塩分・低温管理の影響が大きくなるため、工程条件で検査候補を調整します。'});
  else if(f.group==='乳・卵') a.push({test:'製品区分に応じて選択',title:'殺菌・発酵・熟成条件が異なる',text:'有用菌が多い製品では一般生菌の単純評価を避け、規格項目・変敗菌・RTEリスクを分けて考えます。'});
  else if(f.group==='飲料・水') a.push({test:'酵母・カビなど',title:'低pHでも長期保存・開封後使用がある',text:'酸性でも酵母・カビによる変敗が起こり得るため、殺菌・充填・包装・保存条件で追加検査を判断します。'});
  else a.push({test:'工程に応じて追加',title:'加熱後の手作業・冷却・包装・長期保存がある',text:'食品名だけで固定せず、原料、加熱、加熱後汚染、冷却、包装、保存のどこにリスクがあるかで検査項目を追加します。'});
 }
 return a;
}
function conditionalAdviceHtml(f){
 const a=conditionalAdvice(f);
 return a.map(x=>`<div class="condBox"><div class="condHead">${esc(x.title)} <span class="priorityCond">${esc(x.test)}</span></div><div class="condText">${esc(x.text)}</div></div>`).join('');
}

function uniqTests(arr){
 return [...new Set(arr.filter(Boolean))];
}
function foodModelSets(f){
 const n=f.name;
 let basic=[], risk=[], quality=[], note='';

 // 冷凍食品
 if(/冷凍食品|冷凍野菜/.test(n)){
  basic=['一般生菌数','大腸菌群','大腸菌（E. coli）'];
  risk=/無加熱摂取/.test(n)?['黄色ブドウ球菌','サルモネラ','リステリア']:['黄色ブドウ球菌','サルモネラ'];
  quality=['真菌（カビ）','酵母'];
  note='冷凍食品は「無加熱摂取」「加熱後摂取」「凍結直前の加熱有無」で見る項目が変わります。正式区分を先に確認します。';
 }
 // 生鮮・水産
 else if(/刺身|生食用冷凍鮮魚介類|生食用かき|加熱用かき|寿司|ゆでだこ|ゆでがに|魚肉練り|スモークサーモン|いくら|魚卵/.test(n)){
  basic=['一般生菌数','大腸菌群'];
  if(/刺身|生食用|寿司|かき|魚卵/.test(n)) risk.push('腸炎ビブリオ');
  if(/スモークサーモン|いくら|魚卵/.test(n)) risk.push('リステリア');
  if(/ゆで|魚肉練り|寿司/.test(n)) risk.push('黄色ブドウ球菌');
  if(/魚肉練り/.test(n)) risk.push('サルモネラ');
  quality=['酵母','真菌（カビ）'];
  note='水産品は生食・加熱済み・塩蔵・冷蔵RTEなどでリスクが変わります。海産生食では腸炎ビブリオ、冷蔵RTEではリステリアを条件付きで重視します。';
 }
 // 鶏
 else if(/鶏肉/.test(n)){
  basic=['一般生菌数','大腸菌群','大腸菌（E. coli）','黄色ブドウ球菌'];
  risk=['サルモネラ','カンピロバクター（定性）'];
  quality=[];
  note='鶏肉ではサルモネラ、カンピロバクターを重要な危害要因として検討。特に内臓摘出・レバー/砂肝処理・解体・腸管内容物との接触がある場合はカンピロバクターの優先度を上げます。';
 }
 // 牛・ひき肉・ローストビーフ
 else if(/牛肉|ローストビーフ|生ハンバーグ|ひき肉/.test(n)){
  basic=['一般生菌数','大腸菌群','大腸菌（E. coli）','黄色ブドウ球菌'];
  risk=['サルモネラ','O157'];
  if(/ローストビーフ/.test(n)) risk.push('リステリア');
  quality=[];
  note='生肉・ひき肉・低温調理では原料由来リスクと中心加熱を確認。加熱後にスライスし冷蔵するRTE製品ではリステリアも条件付きで検討します。';
 }
 // 豚・食肉製品
 else if(/豚肉|ハム|ソーセージ|ベーコン/.test(n)){
  basic=['一般生菌数','大腸菌群','大腸菌（E. coli）','黄色ブドウ球菌'];
  risk=['サルモネラ'];
  if(/ハム|ソーセージ|ベーコン/.test(n)) risk.push('リステリア','クロストリジア');
  quality=['乳酸菌数'];
  note='食肉製品は製品区分・加熱・包装条件で成分規格や危害が変わります。真空・低酸素包装や長期冷蔵では嫌気性菌、乳酸菌、リステリアを条件付きで検討します。';
 }
 // 弁当・惣菜・調理パン
 else if(/弁当|そうざい|惣菜|サラダ|おにぎり|カレー|シチュー|煮物|サンドイッチ|調理パン|ポテトサラダ|卵焼き|だし巻き|唐揚げ|フライ類|麺類|餃子|しゅうまい/.test(n)){
  basic=['一般生菌数','大腸菌群','大腸菌（E. coli）','黄色ブドウ球菌'];
  risk=[];
  if(/卵焼き|だし巻き|サンドイッチ|調理パン|餃子|しゅうまい/.test(n)) risk.push('サルモネラ');
  if(/おにぎり|米飯|麺類/.test(n)) risk.push('セレウス（定性）');
  if(/カレー|シチュー|煮物/.test(n)) risk.push('ウェルシュ（定性）','セレウス（定性）');
  if(/サラダ|サンドイッチ|ポテトサラダ/.test(n)) risk.push('リステリア');
  quality=['酵母','真菌（カビ）'];
  note='惣菜類は「加熱後の手作業」「冷却」「保存温度」が重要です。米飯・麺はセレウス、大鍋調理はウェルシュ、冷蔵RTEはリステリアを条件付きで追加します。';
 }
 // 大豆
 else if(/豆腐|油揚げ|厚揚げ|豆乳/.test(n)){
  basic=['一般生菌数','大腸菌群','大腸菌（E. coli）','黄色ブドウ球菌'];
  risk=[];
  quality=['酵母','乳酸菌数'];
  note='豆腐類は加熱後の水さらし・冷却・充填・包装による再汚染を重視。日持ちや膨張・酸敗などの相談では酵母・乳酸菌等も検討します。';
 }
 else if(/納豆/.test(n)){
  basic=['大腸菌群','大腸菌（E. coli）'];
  risk=['黄色ブドウ球菌'];
  quality=['酵母','真菌（カビ）'];
  note='発酵食品では有用菌が多いため一般生菌数の単純評価は不向きな場合があります。衛生指標と異常発酵・変敗菌を目的別に選びます。';
 }
 else if(/味噌|発酵調味料|キムチ|漬物|浅漬/.test(n)){
  basic=['大腸菌群','大腸菌（E. coli）'];
  risk=['黄色ブドウ球菌'];
  quality=['酵母','真菌（カビ）','乳酸菌数'];
  note='発酵・漬物はpH、塩分、Aw、低温管理が重要。酵母・カビ・乳酸菌は品質評価の目的で追加します。';
 }
 // 菓子・パン
 else if(/クッキー|焼菓子|和菓子|生菓子|洋菓子|パン|菓子パン|プリン|ゼリー/.test(n)){
  basic=['一般生菌数','大腸菌群'];
  risk=['黄色ブドウ球菌'];
  if(/生菓子|洋菓子|プリン/.test(n)) risk.push('サルモネラ');
  quality=['真菌（カビ）','酵母'];
  note='菓子は手作業・卵乳原料・水分活性・包装・保存期間で項目を変えます。焼菓子・低水分品ではカビ・酵母、洋生菓子では黄色ブドウ球菌やサルモネラを重視します。';
 }
 // 乳・卵
 else if(/牛乳|乳飲料|乳製品|アイスクリーム/.test(n)){
  basic=['一般生菌数','大腸菌群'];
  risk=['サルモネラ'];
  quality=['乳酸菌数','酵母','真菌（カビ）'];
  note='乳・乳製品は正式な製品区分により規格が異なります。発酵乳では有用菌を考慮し、一般生菌数の単純評価を避けます。';
 }
 else if(/ヨーグルト|発酵乳/.test(n)){
  basic=['大腸菌群'];
  risk=[];
  quality=['乳酸菌数','酵母','真菌（カビ）'];
  note='発酵乳は乳酸菌を含むため、衛生指標と発酵状態・変敗菌を分けて評価します。';
 }
 else if(/チーズ/.test(n)){
  basic=['大腸菌群','大腸菌（E. coli）'];
  risk=['リステリア'];
  quality=['酵母','真菌（カビ）'];
  note='ナチュラル/プロセス、熟成、加熱の有無、RTE性、冷蔵保存期間で検査の優先度が変わります。';
 }
 else if(/卵|液卵/.test(n)){
  basic=['一般生菌数','大腸菌群'];
  risk=['サルモネラ'];
  quality=[];
  note='卵・液卵はサルモネラを優先。未殺菌液卵、生・半熟用途では原料仕様と加熱条件を重点確認します。';
 }
 // 飲料・水
 else if(/清涼飲料|ミネラルウォーター|井戸水|飲用水|氷/.test(n)){
  basic=['一般生菌数','大腸菌（E. coli）'];
  risk=[];
  quality=['酵母','真菌（カビ）'];
  note='飲料・水は製品・用途ごとの法令上の規格や水質基準を優先。酸性・糖含有飲料では酵母、製造設備ではバイオフィルム等も考慮します。';
 }
 // 野菜果実
 else if(/カット野菜|生野菜|カットフルーツ|果実|加熱済み野菜|温野菜/.test(n)){
  basic=['一般生菌数','大腸菌群','大腸菌（E. coli）'];
  risk=['黄色ブドウ球菌'];
  if(/加熱済み野菜|温野菜|カット野菜/.test(n)) risk.push('リステリア');
  quality=['酵母','真菌（カビ）'];
  note='非加熱野菜は原料由来菌が反映されやすいため、衛生指標は工程・洗浄条件と合わせて解釈。加熱後RTEや長期冷蔵ではリステリアを検討します。';
 }
 // RTE / 真空
 else if(/RTE/.test(n)){
  basic=['一般生菌数','大腸菌群','大腸菌（E. coli）','黄色ブドウ球菌'];
  risk=['サルモネラ','リステリア'];
  quality=['乳酸菌数','酵母','真菌（カビ）'];
  note='RTE食品は喫食前の再加熱がないため、加熱後環境からの再汚染と冷蔵中の増殖を重視します。';
 }
 else if(/真空包装|低酸素包装/.test(n)){
  basic=['一般生菌数','大腸菌群'];
  risk=['クロストリジア','ウェルシュ（定性）','リステリア'];
  quality=['乳酸菌数','酵母'];
  note='真空・低酸素包装は嫌気性菌を考慮。pH、Aw、加熱条件、冷蔵条件、保存期間をセットで確認します。';
 }
 else if(/保存試験/.test(n)){
  basic=['一般生菌数','大腸菌群'];
  risk=['食品特性に応じた食中毒菌'];
  quality=['真菌（カビ）','酵母','乳酸菌数'];
  note='保存試験は食品特性に合わせて菌項目、pH、Aw、官能等を組み合わせます。単一の固定セットではなく期限設定の目的から設計します。';
 }
 // 調味料・乾燥品
 else if(/ソース|たれ|ドレッシング|ジャム|フルーツソース|乾燥食品|乾物/.test(n)){
  basic=['一般生菌数','大腸菌群'];
  risk=[];
  if(/乾燥食品|乾物/.test(n)) risk.push('セレウス（定性）');
  quality=['真菌（カビ）','酵母'];
  note='pH、Aw、糖・塩濃度、加熱充填、乾燥度でリスクが変わります。低水分・酸性でもカビ・酵母の保存性評価が重要です。';
 }

 if(!basic.length) basic=f.suggest.slice(0,Math.min(3,f.suggest.length));
 if(!risk.length) risk=f.suggest.filter(x=>/サルモネラ|黄色ブドウ|O157|カンピロ|リステリア|セレウス|ウェルシュ|クロストリジア|腸炎ビブリオ/.test(x));
 if(!quality.length) quality=f.suggest.filter(x=>/真菌|酵母|乳酸/.test(x));

 // 既存の推奨候補にない項目もモデルとして表示できるが、検査マスタに存在しない場合は単なる文字表示にする。
 return {
  basic:uniqTests(basic),
  risk:uniqTests(risk),
  quality:uniqTests(quality),
  note:note || '複数の検査機関の公開情報と食品特性・製造工程を整理した自主検査モデルです。'
 };
}

function resultLogic(food,test,result){
 let meaning='', causes=[], next=[], talk='';
 const cooked=/加熱|焼菓子|煮物|カレー|ハム|ソーセージ|ベーコン|豆腐|ゆで/.test(food.name);
 const rte=/RTE|寿司|刺身|サラダ|サンド|おにぎり|生食|カット/.test(food.name);
 if(test.includes('大腸菌群')){
  meaning='大腸菌群は衛生状態を見る指標の一つです。陽性だけで糞便汚染やO157を意味するわけではありません。';
  causes=cooked?['加熱条件・加熱むら','加熱後の器具・手指からの再汚染','洗浄・殺菌不足']:['原料由来','洗浄水や器具からの汚染','取扱い中の二次汚染'];
  next=['その食品に大腸菌群の法的規格があるか確認','同一ロット・前後ロットを確認','工程別または器具の拭き取りで切り分け'];
  talk='大腸菌群が出たことだけで食中毒菌がいるとは言えません。食品区分を確認した上で、'+(cooked?'加熱と加熱後工程':'原料・洗浄・取扱工程')+'を順に確認します。';
 } else if(test.includes('大腸菌') || test.includes('O157')){
  meaning=test.includes('O157')?'O157は腸管出血性大腸菌として重要な病原菌です。':'E. coliは大腸菌群より糞便系汚染との関連が強い指標ですが、陽性だけでO157を意味しません。';
  causes=['原料由来','加熱不足','生原料・手指・器具からの交差汚染'];
  next=['食品区分と規格基準を確認','加熱記録・使用水・作業動線を確認','必要に応じて病原大腸菌等の追加検査を検討'];
  talk='まず製品区分と基準を確認し、原料・加熱・交差汚染のどこに可能性があるかを切り分けます。';
 } else if(test.includes('一般生菌')){
  meaning='一般生菌数は食品の微生物学的な状態を見る指標ですが、数値だけで特定の食中毒菌の存在は判断できません。';
  causes=['原料菌数が高い','加熱不足または加熱後汚染','冷却・保存中の増殖'];
  next=['原料と製品を比較','加熱・冷却・保存温度記録を確認','大腸菌群等と合わせて工程を評価'];
  talk='菌数が高い原因は一つとは限らないので、原料、加熱、加熱後、冷却・保存の順に確認します。';
 } else if(test.includes('黄色ブドウ')){
  meaning='人の皮膚や鼻腔などにも存在する菌で、手作業や加熱後工程の衛生確認に重要です。';
  causes=['手指・手袋からの汚染','加熱後の盛付け工程','温度管理不良による増殖'];
  next=['手洗い・手袋交換を確認','手荒れ・傷の管理を確認','放冷・保管時間と温度を確認'];
  talk='特に加熱後の手作業と、菌を増やさない時間・温度管理を確認します。';
 } else if(test.includes('サルモネラ')||test.includes('カンピロ')){
  meaning='食中毒原因菌として扱う必要がある項目です。';
  causes=['原料由来','加熱不足','生原料からの交差汚染'];
  next=['該当する規格・顧客基準を確認','原料ロットと加熱記録を確認','生・加熱済み区域や器具の分離を確認'];
  talk='衛生指標菌とは扱いが異なるため、基準を確認しながら原料・加熱・交差汚染を優先して調べます。';
 } else if(test.includes('セレウス')||test.includes('ウェルシュ')||test.includes('クロストリジア')){
  meaning='芽胞形成菌を考慮する項目です。加熱だけでなく、加熱後の冷却・保管条件が重要です。';
  causes=['原料由来の芽胞','緩慢な冷却','不適切な保温・保存'];
  next=['加熱後の品温推移を確認','小分け・急速冷却の有無を確認','保管時間・温度を確認'];
  talk='加熱したかだけでなく、加熱後に増殖させない管理ができていたかを確認します。';
 } else if(test.includes('真菌')||test.includes('酵母')){
  meaning='主に保存性や変敗の評価に関係します。';
  causes=['原料・環境由来','包装後の吸湿・結露','保存条件不良'];
  next=['Aw・pHを確認','包装状態を確認','保存温度・期間と製造環境を確認'];
  talk='菌数だけでなくAw、pH、包装、保存条件と組み合わせて評価します。';
 } else if(test.includes('リステリア')){
  meaning='低温でも増殖し得るため、特にRTE・冷蔵食品では重要な危害要因です。';
  causes=['原料由来','製造環境からの汚染','加熱後の再汚染','長期冷蔵中の増殖'];
  next=['RTE食品か確認','加熱後ゾーン・設備を確認','冷蔵温度と期限設定を確認','環境拭き取りを検討'];
  talk='製品だけでなく、加熱後の製造環境と冷蔵保存条件も合わせて確認します。';
 } else {
  meaning='この結果は食品の種類・工程・基準と合わせて評価する必要があります。';
  causes=['原料由来','製造工程由来','保存・流通条件'];
  next=['適用基準を確認','工程記録を確認','再検査や工程別検査を検討'];
  talk='結果だけで原因を決めず、製品特性と工程から順に切り分けます。';
 }
 return {meaning,causes,next,talk};
}

 <div class="note">この逆引きは原因を断定する機能ではありません。検査結果は食品区分、製造工程、採取条件、規格基準・顧客基準などと合わせて評価してください。</div>`;
}
function showCase(i){
 const c=cases[i];
 const extras=c.extra.map(n=>{let ti=findTest(n);return ti>=0?`<span class="chip" onclick="event.stopPropagation();showDetail(${ti})">${esc(tests[ti].name)} →</span>`:`<span class="chip">${esc(n)}</span>`}).join('');
 app.innerHTML=`<button class="back" onclick="showCases()">← 逆引き一覧へ</button>
 <div class="card detail"><h2>${c.icon} ${esc(c.title)}</h2><p>${esc(c.summary)}</p>
 <h3>① この結果から言えること</h3><div class="step"><p>${esc(c.meaning)}</p></div>
 <h3>② 考えられる原因</h3>${c.causes.map(x=>`<div class="step"><p>${esc(x)}</p></div>`).join('')}
 <h3>③ 現場で確認するポイント</h3>${c.checks.map(x=>`<div class="step"><p>${esc(x)}</p></div>`).join('')}
 <h3>④ 追加検査の候補</h3><div>${extras}</div>
 <h3>⑤ お客様への説明例</h3><div class="step"><p>${esc(c.talk)}</p></div>
 <div class="note">「考えられる原因」は可能性の整理であり、検査結果だけから原因を断定するものではありません。必要に応じて再検査、工程別検査、拭き取り検査などで切り分けます。</div>
 <h3>公的情報</h3><p><a href="https://www.fsc.go.jp/foodsafetyinfo_map/foodhazinfohub/foodhazinfohub_bio.html" target="_blank">食品安全委員会：微生物等</a><br><a href="https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/shokuhin/syokuchu/saikin.html" target="_blank">厚生労働省：細菌による食中毒</a></p>
 </div>`;
}

function addQuote(i){if(!quote.includes(i))quote.push(i);updateCount();showQuote()}
function removeQuote(i){quote=quote.filter(x=>x!==i);updateCount();showQuote()}
function updateCount(){document.getElementById('count').textContent=quote.length?'('+quote.length+')':''}
function dayRank(s){let nums=(s.match(/\d+/g)||[]).map(Number);return nums.length?Math.max(...nums):0}
function showQuote(){
 setTab('tabQuote');
 if(!quote.length){app.innerHTML='<div class="card empty">まだ検査項目が追加されていません。<br>「検査」から項目を追加してください。</div>';return}
 let total=quote.reduce((a,i)=>a+(tests[i].price||0),0), unknown=quote.some(i=>tests[i].price==null);
 let max=Math.max(...quote.map(i=>dayRank(tests[i].days)));
 app.innerHTML=`<div class="card"><h2 style="margin-top:0">見積りリスト</h2>${quote.map(i=>`<div class="quoteItem"><div><b>${esc(tests[i].name)}</b><br><small>報告 ${esc(tests[i].days)}</small></div><div style="text-align:right">${money(tests[i].price)}<br><button class="secondary" onclick="removeQuote(${i})">削除</button></div></div>`).join('')}
 <div class="total">合計 ${total.toLocaleString()}円${unknown?' ＋ 要確認項目':''}</div>
 <div style="margin-top:6px">最長報告目安：<b>${max?max+'日':'要確認'}</b></div>
 <div class="note">税区分・セット料金・検体数・試験法などにより実際の見積額や納期が変わる場合があります。正式見積り前に社内資料で確認してください。</div></div>`;
}
